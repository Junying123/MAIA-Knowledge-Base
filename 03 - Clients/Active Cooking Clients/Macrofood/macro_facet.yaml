document: "MAIA - MacroFrozen Item Facet Definition"
purpose: >
  Define MacroFrozen frozen meat and food item hierarchy, item-only facets,
  filters, and search conditions based on observed item names and MAIA KB notes.

products:
  item_group: "Products"
  level: 0
  Frozen Meat / Food:
    item_group: "Frozen Meat / Food"
    level: 1
    section:
      - section_idx: 0
        label: "Product Identification"
        section_description: "Core item identity fields used for search, matching, and catalog grouping."
      - section_idx: 1
        label: "Meat Specification"
        section_description: "Cut, bone, skin, form, weight, and preparation details."
      - section_idx: 2
        label: "Origin & Brand"
        section_description: "Country, supplier, brand, and origin markers from the item name."
      - section_idx: 3
        label: "Pack & Unit"
        section_description: "Selling unit, pack size, and weight-related item attributes."
      - section_idx: 4
        label: "Alias & Raw Text"
        section_description: "Chinese name, alternate name, and raw item name for matching."
    attributes:
      meat_type:
        facet_idx: 0
        section: "Product Identification"
        item_facet: "Meat Type"
        facet_description: "The primary product family, such as beef, buffalo, chicken, pork, duck, lamb, seafood, or processed frozen food."
        is_required: 1
        data_type: "Enum"
        values: ["Beef", "Buffalo", "Chicken", "Pork", "Duck", "Lamb", "Seafood", "Processed Meat / Frozen Prepared Food", "Miscellaneous / Unclassified"]
        doctypes: []
      cut_part:
        facet_idx: 1
        section: "Product Identification"
        item_facet: "Cut / Part"
        facet_description: "The item cut or anatomical part, such as belly, collar, shoulder, breast, wing, shortribs, trotter, spare ribs, or back fat."
        is_required: 0
        data_type: "Text"
        doctypes: []
      product_form:
        facet_idx: 2
        section: "Meat Specification"
        item_facet: "Product Form"
        facet_description: "The product form or preparation shape, such as ball, roll, cube, chop, slice, strip, fillet, whole, joint, mince, or trimming."
        is_required: 0
        data_type: "Enum"
        values: ["Ball", "Roll", "Cube", "Chop", "Slice", "Strip", "Fillet", "Whole", "Joint", "Mince", "Trimming", "Block", "Patty", "Nugget", "Sausage", "Mixed Pack", "Other"]
        doctypes: []
      bone_state:
        facet_idx: 3
        section: "Meat Specification"
        item_facet: "Bone State"
        facet_description: "Whether the item is bone-in, boneless, with bone, or unspecified."
        is_required: 0
        data_type: "Enum"
        values: ["Bone In", "Boneless", "With Bone", "Unspecified"]
        doctypes: []
      skin_state:
        facet_idx: 4
        section: "Meat Specification"
        item_facet: "Skin State"
        facet_description: "Whether the item is skin-on, skinless, or unspecified."
        is_required: 0
        data_type: "Enum"
        values: ["Skin On", "Skinless", "Unspecified"]
        doctypes: []
      cut_style:
        facet_idx: 5
        section: "Meat Specification"
        item_facet: "Cut Style"
        facet_description: "The specific cutting style or customer-facing cut wording, such as oyster meat, three joint wing, mid joint wing, hind knee, or picnic."
        is_required: 0
        data_type: "Text"
        doctypes: []
      thickness:
        facet_idx: 6
        section: "Meat Specification"
        item_facet: "Thickness"
        facet_description: "Thickness or special cut instruction, such as 3mm or thick cut, when stated."
        is_required: 0
        data_type: "Text"
        doctypes: []
      origin_country:
        facet_idx: 7
        section: "Origin & Brand"
        item_facet: "Origin Country"
        facet_description: "Country or origin marker in the item name, such as Brazil, Thailand, Netherlands, or Denmark."
        is_required: 0
        data_type: "Text"
        doctypes: []
      brand_supplier:
        facet_idx: 8
        section: "Origin & Brand"
        item_facet: "Brand / Supplier"
        facet_description: "Brand, supplier, packer, or trading name, such as Seaboard, FACCSA, Litera, Mafresa, Rivasam, Blackgold, Danish Crown, or Lordfood."
        is_required: 0
        data_type: "Text"
        doctypes: []
      weight_range:
        facet_idx: 9
        section: "Pack & Unit"
        item_facet: "Weight Range"
        facet_description: "Weight range or stated product weight, such as 30KG - 40KG."
        is_required: 0
        data_type: "Text"
        doctypes: []
      pack_size:
        facet_idx: 10
        section: "Pack & Unit"
        item_facet: "Pack Size"
        facet_description: "Pack quantity or packing instruction, such as carton, pack, bag, or kg per pack."
        is_required: 0
        data_type: "Text"
        doctypes: []
      uom:
        facet_idx: 11
        section: "Pack & Unit"
        item_facet: "UOM"
        facet_description: "Selling or measurement unit, such as KG, CTN, pack, bag, piece, or box."
        is_required: 0
        data_type: "Enum"
        values: ["KG", "CTN", "Pack", "Bag", "Piece", "Box", "Other"]
        doctypes: []
      chinese_name:
        facet_idx: 12
        section: "Alias & Raw Text"
        item_facet: "Chinese Name"
        facet_description: "Chinese item name or customer-facing Chinese alias when present in the item name."
        is_required: 0
        data_type: "Text"
        doctypes: []
      alternate_name:
        facet_idx: 13
        section: "Alias & Raw Text"
        item_facet: "Alternate Name"
        facet_description: "Alternate English name, abbreviation, or common customer wording for the item."
        is_required: 0
        data_type: "Text"
        doctypes: []
      raw_item_name:
        facet_idx: 14
        section: "Alias & Raw Text"
        item_facet: "Raw Item Name"
        facet_description: "Original item name exactly as received from SQL or source system."
        is_required: 0
        data_type: "Text"
        doctypes: []
